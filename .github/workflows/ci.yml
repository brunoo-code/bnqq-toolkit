name: Windows regression
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Regression without tuning the host
        shell: powershell
        run: ./tests/Regression.ps1
      - name: Reversible game preference fixtures
        shell: powershell
        run: ./tests/GameProfile.ps1
      - name: Frame caps and performance regression gates
        shell: powershell
        run: |
          ./tests/FramePacing.ps1
          ./tests/PerformanceGates.ps1
      - name: Session lifecycle and unified recovery
        shell: powershell
        run: |
          ./tests/GameSession.ps1
          ./tests/NetworkSession.ps1
          ./tests/CpuSession.ps1
          ./tests/RecoveryHub.ps1
      - name: Legacy IFEO migration fixtures
        shell: powershell
        run: ./tests/LegacyMigration.ps1
      - name: NVIDIA profile and GPU capture fixtures (no driver writes)
        shell: powershell
        run: |
          ./tests/GpuDriver.ps1
          ./tests/GpuTelemetry.ps1
          ./tests/GpuCaptureLifecycle.ps1
      - name: Memory, NVMe and NIC fixtures (no hardware tuning)
        shell: powershell
        run: |
          ./tests/StorageMemory.ps1
          ./tests/NicPolicy.ps1
      - name: Focus and maintenance leases (mock adapters)
        shell: powershell
        run: |
          ./tests/GovernanceScopes.ps1
          ./tests/NicActivation.ps1
          ./tests/Maintenance.ps1
          ./tests/FocusSession.ps1
      - name: Compile launcher and payload
        shell: powershell
        run: ./build.ps1 -KeepBuild
      - name: Effective comparison fixtures without tuning
        shell: powershell
        run: ./tests/EffectiveBench.ps1
      - name: Verify embedded payload and argument quoting without launching
        shell: powershell
        run: ./tests/Launcher.ps1
